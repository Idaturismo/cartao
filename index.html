<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cartão digital Ida Turismo — Quer viajar? A Ida te leva.">
<meta name="theme-color" content="#0d4a31">
<title>Ida Turismo | Cartão Digital</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7f3ec}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.card-wrap{width:min(100vw,680px);padding:12px}
.card{position:relative;width:100%;line-height:0}
.card img{display:block;width:100%;height:auto;border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.18)}
.hit{position:absolute;display:block;z-index:5;border-radius:24px;cursor:pointer}
.hit:focus-visible{outline:3px solid #caa35a;outline-offset:3px}
.wa{left:8.5%;top:55.7%;width:83%;height:7.2%}
.site{left:8.5%;top:64.2%;width:83%;height:7.2%}
.ig{left:8.5%;top:72.9%;width:83%;height:7.2%}
.email{left:8.5%;top:81.6%;width:83%;height:7.2%}
@media (max-width:520px){
 .card-wrap{padding:6px}
 .card img{border-radius:22px}
}
</style>
</head>
<body>
<main class="card-wrap">
  <div class="card">
    <img src="cartao-ida-oficial.png" alt="Cartão digital Ida Turismo">
    <a class="hit wa" href="https://wa.me/5511988652718?text=Ol%C3%A1%2C%20Ida!%20Gostaria%20de%20planejar%20uma%20viagem." target="_blank" rel="noopener" aria-label="Falar com a Ida no WhatsApp"></a>
    <a class="hit site" href="https://www.idaturismo.com.br" target="_blank" rel="noopener" aria-label="Conheça o site da Ida Turismo"></a>
    <a class="hit ig" href="https://www.instagram.com/idaturismo/" target="_blank" rel="noopener" aria-label="Instagram da Ida Turismo"></a>
    <a class="hit email" href="mailto:contato@idaturismo.com.br" aria-label="Enviar e-mail para a Ida Turismo"></a>
  </div>
</main>
</body>
</html>
